<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   htmldoc — DO NOT MODIFY STYLES OR SCRIPT. Content slots only.
   Playful deck system: warm off-white sheet, chunky rounded
   cards (one corner squared), tangerine / violet / lime chips,
   ink-black hero panel, friendly geometric sans + mono details.
   Dark mode keeps the candy accents on a soft charcoal sheet.
   ============================================================ */
:root {
  /* palette: Paper #F7F5F1 · Ink #171514 · Tangerine #EE6416 · Violet #8B5CF6 · Lime #C9F04D */
  --display: "Poppins", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --surround: #e7e5e1;
  --bg: #f7f5f1;
  --frame: #d8d4cd;
  --card: #ffffff;
  --card-2: #efece6;
  --line: #d9d4cc;
  --line-soft: #e6e2db;
  --rule: #171514;
  --text: #171514;
  --muted: #5f5a54;
  --faint: #8a847c;
  --accent: #8b5cf6;
  --accent-strong: #7743ec;
  --accent-ink: #2a1259;
  --pop: #ee6416;
  --pop-ink: #3d1503;
  --lime: #c9f04d;
  --lime-ink: #23290b;
  --tldr-bg: #171514;
  --tldr-ink: #f7f5f1;
  --tldr-muted: #b3ada5;
  --tldr-edge: transparent;
  --sheet-art: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" fill="none"><path d="M12 200 C 90 120, 170 90, 235 128 C 300 166, 262 236, 322 232 C 388 228, 372 138, 442 118 C 500 102, 540 130, 560 160" stroke="rgb(150,144,136)" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/></svg>');
  --guy-peek: url('data:image/svg+xml;utf8,<svg viewBox="0 0 120 76" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 76 L12 64 C10 26 32 3 59 4 C85 5 110 24 108 64 L108 76 Z" fill="%23ef6a1e"/><circle cx="43" cy="36" r="5.5" fill="%2320140c"/><circle cx="77" cy="39" r="5.5" fill="%2320140c"/><path d="M53 50 q7 5.5 14 0" stroke="%2320140c" stroke-width="4.5" stroke-linecap="round"/><rect x="14" y="54" width="18" height="10" rx="5" transform="rotate(6 23 59)" fill="%23d85a12"/><rect x="88" y="54" width="18" height="10" rx="5" transform="rotate(-6 97 59)" fill="%23d85a12"/></svg>');
  --guy-peek-blink: url('data:image/svg+xml;utf8,<svg viewBox="0 0 120 76" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 76 L12 64 C10 26 32 3 59 4 C85 5 110 24 108 64 L108 76 Z" fill="%23ef6a1e"/><path d="M37 36 q6 3.5 12 0" stroke="%2320140c" stroke-width="3.5" stroke-linecap="round"/><path d="M71 39 q6 3.5 12 0" stroke="%2320140c" stroke-width="3.5" stroke-linecap="round"/><path d="M53 50 q7 5.5 14 0" stroke="%2320140c" stroke-width="4.5" stroke-linecap="round"/><rect x="14" y="54" width="18" height="10" rx="5" transform="rotate(6 23 59)" fill="%23d85a12"/><rect x="88" y="54" width="18" height="10" rx="5" transform="rotate(-6 97 59)" fill="%23d85a12"/></svg>');
  --code-bg: #f0ede7;
  --add-bg: #e3f2c8;
  --add-ink: #3c5410;
  --del-bg: #fbe0d2;
  --del-ink: #a53c10;
  --hunk-ink: #8a847c;
  --tok-kw: #7743ec;
  --tok-str: #4a7a1f;
  --tok-com: #948e85;
  --tok-num: #cf5410;
  --tok-fn: #171514;
  --shadow: 0 1px 2px rgba(23, 21, 20, .05), 0 24px 60px -36px rgba(23, 21, 20, .3);
}
@media (prefers-color-scheme: dark) {
  :root {
    --surround: #121110;
    --bg: #1c1a19;
    --frame: #34302d;
    --card: #262322;
    --card-2: #2f2b29;
    --line: #423d39;
    --line-soft: #35312e;
    --rule: #6d655d;
    --text: #f0ede8;
    --muted: #aca69e;
    --faint: #837d75;
    --accent: #a78bfa;
    --accent-strong: #c0adfb;
    --accent-ink: #221743;
    --pop: #f57c35;
    --pop-ink: #2e1503;
    --lime: #cff158;
    --lime-ink: #23290b;
    --tldr-bg: #100e0d;
    --tldr-ink: #f4f1eb;
    --tldr-muted: #b0aaa2;
    --tldr-edge: #3b3632;
    --sheet-art: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" fill="none"><path d="M12 200 C 90 120, 170 90, 235 128 C 300 166, 262 236, 322 232 C 388 228, 372 138, 442 118 C 500 102, 540 130, 560 160" stroke="rgb(214,206,196)" stroke-opacity="0.11" stroke-width="10" stroke-linecap="round"/></svg>');
    --code-bg: #151312;
    --add-bg: #1f2a10;
    --add-ink: #c4e386;
    --del-bg: #2f1409;
    --del-ink: #f2a281;
    --hunk-ink: #837d75;
    --tok-kw: #b79dfb;
    --tok-str: #b3d97a;
    --tok-com: #756f67;
    --tok-num: #f5a06a;
    --tok-fn: #f0ede8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 24px 60px -34px rgba(0, 0, 0, .7);
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--surround);
  color: var(--text);
  font-family: var(--display);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
/* the sheet: a big friendly card with a decorative squiggle */
.page {
  position: relative;
  max-width: 960px; margin: 2.5rem auto; padding: 2.5rem 3rem 2.25rem;
  background-color: var(--bg);
  background-image: var(--sheet-art);
  background-repeat: no-repeat;
  background-position: top -60px right -80px;
  border: 1px solid var(--frame);
  border-radius: 28px 28px 28px 8px;
  box-shadow: var(--shadow);
}
a { color: var(--accent-strong); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); }
a:hover { text-decoration-color: var(--accent-strong); }
code, pre, .mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--lime); color: var(--lime-ink); }

/* ---- top bar ---- */
.topbar {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 0 0 .8rem; margin-bottom: 2.5rem;
  border-bottom: 3px solid var(--rule);
}
.brand { font-weight: 700; letter-spacing: .01em; }
.brand span { color: var(--muted); font-weight: 400; }
.topbar-meta { color: var(--muted); font-family: var(--mono); font-size: .74rem; }

/* ---- pills (chips) ---- */
.pill {
  display: inline-block; padding: .22rem .75rem;
  border: 1px solid transparent; border-radius: 999px;
  background: var(--card-2); color: var(--muted);
  font-size: .72rem; font-weight: 600; letter-spacing: .02em;
  white-space: nowrap; text-decoration: none;
}
.pill-type {
  background: var(--pop); color: var(--pop-ink);
  text-transform: uppercase; letter-spacing: .14em; font-size: .64rem; font-weight: 700;
  padding: .32rem .85rem;
}
.pill-loc { font-family: var(--mono); font-size: .68rem; background: var(--card-2); color: var(--text); }
.pill-actual {
  background: var(--lime); color: var(--lime-ink);
  text-transform: uppercase; letter-spacing: .09em; font-size: .6rem; font-weight: 700;
}
.pill-proposed {
  color: var(--pop); border: 1.5px dashed var(--pop); background: transparent;
  text-transform: uppercase; letter-spacing: .09em; font-size: .6rem; font-weight: 700;
}

/* ---- document head ---- */
.doc-head { margin-bottom: 1.75rem; }
.doc-head .pill-type { margin-bottom: 1rem; }
h1 {
  margin: .6rem 0 .9rem; font-size: 2.6rem; line-height: 1.12;
  font-weight: 700; letter-spacing: -.02em;
}
h1 em { font-style: normal; color: var(--pop); }
.standfirst { margin: 0; max-width: 58ch; color: var(--muted); font-size: 1.04rem; }

/* ---- little guys (decorative mascots) ---- */
.tldr::after {
  content: ""; position: absolute; bottom: calc(100% - 9px); right: 2.5rem;
  width: 72px; height: 46px; z-index: -2;
  background: var(--guy-peek) no-repeat center bottom / 72px auto;
  animation: guy-blink 7s infinite;
  transition: transform .18s ease;
}
.tldr:hover::after { transform: translateY(-7px); }
@keyframes guy-blink {
  0%, 91.9%, 96.1%, 100% { background-image: var(--guy-peek); }
  92%, 96% { background-image: var(--guy-peek-blink); }
}

/* ---- TL;DR card (ink hero panel) ---- */
.tldr {
  position: relative; z-index: 0;
  margin: 2rem 0; padding: 1.5rem 1.7rem 1.6rem;
  color: var(--tldr-ink);
}
.tldr::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--tldr-bg);
  border: 1px solid var(--tldr-edge);
  border-radius: 24px 24px 24px 6px; box-shadow: var(--shadow);
}
.tldr .pill { background: var(--lime); color: var(--lime-ink); text-transform: uppercase; letter-spacing: .1em; font-size: .62rem; font-weight: 700; }
.tldr h2 { margin: .95rem 0 .5rem; font-size: 1.5rem; font-weight: 650; letter-spacing: -.012em; line-height: 1.28; }
.tldr p { margin: .4rem 0 0; color: var(--tldr-muted); }
.tldr strong { color: var(--tldr-ink); }
.tldr code { background: color-mix(in srgb, var(--tldr-ink) 14%, transparent); padding: .05rem .3rem; border-radius: 6px; font-size: .85em; }
.tldr a { color: inherit; }

/* ---- TOC + controls: candy chips ---- */
.toc-row { display: flex; flex-wrap: wrap; gap: .45rem 1rem; align-items: center; margin: 1.5rem 0 2.75rem; }
.toc { display: flex; flex-wrap: wrap; gap: .5rem; }
.toc a.pill { transition: transform .12s ease; }
.toc a.pill:nth-child(3n+1) { background: var(--lime); color: var(--lime-ink); }
.toc a.pill:nth-child(3n+2) { background: var(--accent); color: var(--accent-ink); }
.toc a.pill:nth-child(3n)   { background: var(--pop); color: var(--pop-ink); }
.toc-row a.pill:hover { transform: translateY(-2px); }
.ctl-row { display: flex; gap: .45rem; margin-left: auto; }
.ctl {
  border: 1.5px solid var(--rule); border-radius: 999px; background: transparent;
  color: var(--text); font: inherit; font-size: .72rem; font-weight: 600; padding: .18rem .75rem; cursor: pointer;
}
.ctl:hover { background: var(--text); color: var(--bg); }

/* ---- sections ---- */
.sec { margin: 3rem 0; }
.sec-head {
  display: flex; align-items: center; gap: .85rem;
  border-bottom: 1px solid var(--line); padding-bottom: .65rem; margin-bottom: 1.15rem;
}
.sec-num {
  display: grid; place-items: center; flex: none;
  width: 1.7rem; height: 1.7rem; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font-size: .78rem; font-weight: 700; letter-spacing: 0;
}
.sec h2 { margin: 0; font-size: 1.4rem; font-weight: 650; letter-spacing: -.01em; }
.sec h3 { font-size: 1rem; font-weight: 650; margin: 1.6rem 0 .5rem; }
.sec p { max-width: 68ch; }
.sec ul, .sec ol:not(.stepper) { padding-left: 1.3rem; max-width: 66ch; }
.sec li { margin: .3rem 0; }
.sec li::marker { color: var(--pop); font-weight: 700; }

/* ---- multi-column rows ---- */
.cols {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem 1.25rem; align-items: start; margin: 1.25rem 0;
}
.cols.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols > * { margin: 0; min-width: 0; }
@media (max-width: 720px) {
  .cols, .cols.cols-3 { grid-template-columns: 1fr; }
}

/* ---- inline code / tables ---- */
p code, li code, td code {
  background: var(--card-2); border: 1px solid var(--line-soft);
  padding: .04rem .34rem; border-radius: 6px; font-size: .82em;
}
table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .92rem; }
th { text-align: left; color: var(--faint); font-weight: 700; font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; }
th, td { padding: .5rem .75rem; border-bottom: 1px solid var(--line-soft); }
thead th { border-bottom: 2px solid var(--rule); }
tr:last-child td { border-bottom: none; }

/* ---- callouts ---- */
.callout {
  margin: 1.25rem 0; padding: 1rem 1.3rem;
  background: color-mix(in srgb, var(--accent) 12%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 18px 18px 18px 4px;
}
.callout .label { display: block; font-size: .64rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-strong); margin-bottom: .3rem; }
.callout.warn {
  background: color-mix(in srgb, var(--pop) 12%, var(--bg));
  border-color: color-mix(in srgb, var(--pop) 32%, transparent);
}
.callout.warn .label { color: var(--pop); }
.callout p { margin: 0; }

/* ---- code blocks ---- */
.codeblock { margin: 1.25rem 0; }
.codeblock figcaption { margin-bottom: .5rem; }
pre.code {
  position: relative; margin: 0;
  background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: 16px;
  padding: 1rem 1.15rem; overflow-x: auto;
  font-size: .8rem; line-height: 1.6;
}
pre.code button.copy {
  position: absolute; top: .55rem; right: .55rem;
  border: none; border-radius: 999px; background: var(--text);
  color: var(--bg); font: inherit; font-size: .68rem; font-weight: 600; padding: .18rem .65rem; cursor: pointer;
  opacity: 0; transition: opacity .15s;
}
pre.code:hover button.copy,
pre.code button.copy:focus-visible { opacity: 1; }
pre.code button.copy:hover { background: var(--accent); color: var(--accent-ink); }
/* highlight.js token mapping — no external theme; palette-synced via --tok-* */
pre.code code.hljs { background: transparent; padding: 0; }
.hljs-keyword, .hljs-literal, .hljs-built_in, .hljs-type, .hljs-selector-tag { color: var(--tok-kw); font-weight: 600; }
.hljs-string, .hljs-regexp, .hljs-template-tag, .hljs-symbol { color: var(--tok-str); }
.hljs-comment, .hljs-quote { color: var(--tok-com); font-style: italic; }
.hljs-number, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-selector-attr { color: var(--tok-num); }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-name, .hljs-section { color: var(--tok-fn); font-weight: 600; }
.hljs-meta, .hljs-doctag { color: var(--hunk-ink); }

/* ---- mermaid diagrams ---- */
figure { margin: 1.25rem 0; }
figure figcaption { margin-bottom: .5rem; color: var(--muted); font-size: .82rem; }
pre.mermaid {
  margin: 0; background: var(--card); border: 1px solid var(--line-soft); border-radius: 16px;
  padding: 1rem; overflow-x: auto; text-align: center;
}
pre.mermaid svg { max-width: 100%; height: auto; }

/* ---- diffs ---- */
details.diff { margin: 1.25rem 0; border: 1px solid var(--line-soft); border-radius: 16px; background: var(--card); overflow: hidden; }
details.diff > summary {
  display: flex; align-items: center; gap: .6rem;
  padding: .65rem 1.05rem; cursor: pointer; list-style: none; user-select: none;
}
details.diff > summary::-webkit-details-marker { display: none; }
details.diff > summary::before { content: "▸"; color: var(--pop); font-size: .8rem; transition: transform .15s; }
details.diff[open] > summary::before { transform: rotate(90deg); }
.diff-file { font-family: var(--mono); font-size: .78rem; font-weight: 600; }
.diff-body { border-top: 1px solid var(--line-soft); background: var(--code-bg); overflow-x: auto; padding: .5rem 0; }
.dline { padding: .06rem 1rem; font-family: var(--mono); font-size: .78rem; line-height: 1.6; white-space: pre; }
.dline.add { background: var(--add-bg); color: var(--add-ink); }
.dline.del { background: var(--del-bg); color: var(--del-ink); }
.dline.hunk { color: var(--hunk-ink); padding-top: .4rem; padding-bottom: .2rem; }
.dline.ctx { color: var(--muted); }

/* ---- stepper (numbered candy cards) ---- */
ol.stepper { list-style: none; counter-reset: step; margin: 1.5rem 0; padding: 0; }
ol.stepper > li.step {
  counter-increment: step;
  position: relative; margin: 0 0 1.25rem; padding: 1.2rem 1.5rem 1.3rem 4.6rem;
  background: var(--card); border: 1px solid var(--line-soft); border-radius: 20px 20px 20px 5px;
  box-shadow: 0 1px 2px rgba(23, 21, 20, .04);
}
ol.stepper > li.step::before {
  content: counter(step);
  position: absolute; left: 1.2rem; top: 1.2rem;
  width: 2.15rem; height: 2.15rem; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font-size: .85rem; font-weight: 700;
}
ol.stepper > li.step:nth-child(3n+2)::before { background: var(--pop); color: var(--pop-ink); }
ol.stepper > li.step:nth-child(3n)::before { background: var(--lime); color: var(--lime-ink); }
ol.stepper > li.step:not(:last-child)::after {
  content: ""; position: absolute; left: 2.27rem; top: calc(100% + 1px);
  height: 1.25rem; border-left: 2px dotted var(--faint);
}
.step-head { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-bottom: .3rem; min-height: 2.15rem; }
.step-head h3 { margin: 0; font-size: 1rem; font-weight: 650; }
.step > p { margin: .3rem 0 .6rem; color: var(--muted); font-size: .95rem; max-width: 62ch; }
.step .callout { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
.step details.diff { background: var(--card-2); border-color: transparent; }

/* ---- I/O blocks ---- */
details.io { margin: .5rem 0; border: none; border-radius: 14px; background: var(--card-2); overflow: hidden; }
details.io > summary {
  display: flex; align-items: center; gap: .5rem;
  padding: .45rem .9rem; cursor: pointer; list-style: none; user-select: none;
  font-size: .64rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
}
details.io > summary::-webkit-details-marker { display: none; }
details.io > summary::before { content: "▸"; font-size: .75rem; transition: transform .15s; }
details.io[open] > summary::before { transform: rotate(90deg); }
details.io.io-in > summary { color: var(--muted); }
details.io.io-out > summary { color: var(--accent-strong); }
details.io pre.code { border: none; border-radius: 0; }

/* ---- footer (title block) ---- */
.foot {
  margin-top: 4rem;
  display: flex; flex-wrap: wrap;
  border: 1.5px solid var(--rule); border-radius: 16px; overflow: hidden;
  color: var(--text); font-family: var(--mono); font-size: .76rem;
}
.foot span { flex: 1 1 12rem; padding: .55rem .9rem .6rem; border-right: 1.5px solid var(--rule); }
.foot span:last-child { border-right: none; }
.foot b {
  display: block; margin-bottom: .1rem;
  font-family: var(--display); font-size: .58rem; font-weight: 700;
  letter-spacing: .13em; text-transform: uppercase; color: var(--pop);
}

@media (max-width: 720px) {
  .page { margin: 0; padding: 1.5rem 1.25rem 2rem; border: none; border-radius: 0; }
}
@media (max-width: 560px) {
  h1 { font-size: 1.9rem; }
  ol.stepper > li.step { padding-left: 1.4rem; padding-top: 3.1rem; }
  ol.stepper > li.step:not(:last-child)::after { left: 2.2rem; }
  .foot span { flex-basis: 100%; border-right: none; border-bottom: 1.5px solid var(--rule); }
  .foot span:last-child { border-bottom: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

@media print {
  :root {
    --surround: #ffffff;
    --bg: #ffffff;
    --frame: #ffffff;
    --card: #ffffff;
    --card-2: #f0ede7;
    --line: #c9c4bc;
    --line-soft: #ddd8d0;
    --rule: #171514;
    --text: #171514;
    --muted: #4d4842;
    --faint: #6e6860;
    --accent: #6d3ee0;
    --accent-strong: #5c2ed0;
    --accent-ink: #ffffff;
    --pop: #d3540d;
    --pop-ink: #ffffff;
    --lime: #c9f04d;
    --lime-ink: #23290b;
    --tldr-bg: #171514;
    --tldr-ink: #f7f5f1;
    --tldr-muted: #b3ada5;
    --tldr-edge: transparent;
    --sheet-art: none;
    --code-bg: #f2efe9;
    --add-bg: #e3f2c8;
    --add-ink: #3c5410;
    --del-bg: #fbe0d2;
    --del-ink: #a53c10;
    --hunk-ink: #6e6860;
    --tok-kw: #5c2ed0;
    --tok-str: #3d651a;
    --tok-com: #7c766e;
    --tok-num: #b0480c;

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
if (window.hljs) {
  hljs.configure({ cssSelector: 'pre code[class*="language-"]' });
  hljs.highlightAll();
}
document.querySelectorAll("pre.code").forEach(pre => {
  const b = document.createElement("button");
  b.className = "copy"; b.type = "button"; b.textContent = "Copy";
  b.addEventListener("click", async () => {
    const code = pre.querySelector("code");
    await navigator.clipboard.writeText((code ?? pre).innerText);
    b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1200);
  });
  pre.appendChild(b);
});
const setAll = open => document.querySelectorAll("details").forEach(d => (d.open = open));
document.getElementById("expand-all")?.addEventListener("click", () => setAll(true));
document.getElementById("collapse-all")?.addEventListener("click", () => setAll(false));
let printState = null;
window.addEventListener("beforeprint", () => {
  printState = [...document.querySelectorAll("details")].map(d => d.open);
  setAll(true);
});
window.addEventListener("afterprint", () => {
  if (printState) document.querySelectorAll("details").forEach((d, i) => (d.open = printState[i]));
  printState = null;
});
</script>

      lineColor: v("--accent"),
      edgeLabelBackground: v("--bg"),
      clusterBkg: v("--bg"),
      clusterBorder: v("--line"),
      titleColor: v("--text"),
      noteBkgColor: v("--card-2"),
      noteTextColor: v("--text"),
