id = "mjsamuel.last-focus"
name = "Last Focus"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Toggle back to the last-focused tab/workspace, tmux last-window/switch-client -l style"
platforms = ["linux", "macos"]

[[events]]
on = "tab.focused"
command = ["lua", "record.lua", "tab"]

[[events]]
on = "workspace.focused"
command = ["lua", "record.lua", "workspace"]

[[actions]]
id = "toggle-tab"
title = "Toggle Last Tab"
command = ["lua", "toggle.lua", "tab"]

[[actions]]
id = "toggle-workspace"
title = "Toggle Last Workspace"
command = ["lua", "toggle.lua", "workspace"]
