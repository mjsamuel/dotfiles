onboarding = false

[terminal]
new_cwd = "follow"
kitty_graphics = true

[worktrees]
directory = "~/.local/share/worktrees"

[theme]
auto_switch = true
dark_name   = "rose-pine"
light_name  = "rose-pine-dawn"

[ui]
mouse_capture                    = true
pane_borders                     = true
pane_outer_borders               = false
pane_gaps                        = false
prompt_new_tab_name              = false
prompt_new_workspace_name        = true
accent                           = "blue"
tab_bar_position                 = "top"
agent_panel_sort                 = "spaces"
right_click_passthrough_modifier = "alt"
status_indicators                = "dots"

[ui.sidebar.agents.rows_by_agent]
pi = [
  [
    "state_icon",
    "machine",
    { token = "workspace", dim = true, bold = false },
    "$session_name"
  ]
]

[ui.toast]
herdr.position    = "top-right"
clipboard.enabled = false
delivery          = "herdr"

[keys]
prefix = "ctrl+b"

# Workspaces
reload_config           = ["prefix+shift+r", "alt+shift+r"]
workspace_picker        = ["prefix+w", "alt+s"]
navigate_workspace_down = ["j", "down"]
navigate_workspace_up   = ["k", "up"]

# Tabs
new_tab           = ["prefix+c", "alt+c"]
rename_tab        = ["prefix+shift+t", "alt+r"]
move_tab_next     = ["alt+>"]
move_tab_previous = ["alt+<"]
switch_tab        = ["prefix+1..9", "alt+1..9"]

split_vertical    = ["prefix+v", "alt+v"]
split_horizontal  = ["prefix+minus", "alt+minus"]

# Panes
focus_pane_left  = ["prefix+h", "alt+h"]
focus_pane_down  = ["prefix+j", "alt+j"]
focus_pane_up    = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
last_pane        = ["alt+p"]
clear_pane       = ["prefix+ctrl+k"]
zoom             = ["prefix+z", "alt+z"]

# Worktrees
open_worktree = ["alt+shift+w"]

[[keys.command]]
key         = ["prefix+o", "alt+o"]
type        = "plugin_action"
command     = "mjsamuel.even-panes.even-panes"
description = "evenly resize panes"

[[keys.command]]
key         = ["prefix+s", "alt+shift+s"]
type        = "popup"
command     = "sessionizer --herdr"
description = "sessionizer"
width       = "80%"
height      = "80%"

[[keys.command]]
key         = ["prefix+n", "alt+shift+n"]
type        = "popup"
command     = "notarizer"
description = "notarizer"
width       = "80%"
height      = "80%"

[[keys.command]]
key = ["prefix+p", "alt+shift+p"]
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"
