onboarding = false

[terminal]
new_cwd = "follow"
kitty_graphics = true

[worktrees]
directory = "~/.local/share/worktrees"

[theme]
auto_switch = true
dark_name   = "rose-pine"
light_name  = "rose-pine-dawn"

[ui]
mouse_capture                    = true
pane_borders                     = true
pane_outer_borders               = false
pane_gaps                        = false
prompt_new_tab_name              = true
prompt_new_workspace_name        = true
accent                           = "blue"
tab_bar_position                 = "top"
agent_panel_sort                 = "spaces"
right_click_passthrough_modifier = "alt"
status_indicators                = "dots"

[ui.sidebar.agents.rows_by_agent]
pi = [
    ["state_icon", "workspace", "tab"],
    ["$summary"],
]

[ui.toast]
herdr.position    = "top-right"
clipboard.enabled = false
delivery          = "herdr"

[keys]
prefix = "ctrl+b"

# Workspaces
navigate_workspace_down = ["j", "down"]
navigate_workspace_up   = ["k", "up"]

# Tabs
move_tab_next     = "alt+>"
move_tab_previous = "alt+<"
switch_tab        = ["prefix+1..9", "alt+1..9"]

# Panes
last_pane = ["alt+l"]
clear_pane = "alt+k"

# Worktrees
open_worktree = ["prefix+ctrl+w"]

[[keys.command]]
key         = "prefix+o"
type        = "plugin_action"
command     = "mjsamuel.even-panes.even-panes"
description = "evenly resize panes"

[[keys.command]]
key         = ["prefix+s", "alt+shift+s"]
type        = "popup"
command     = "herdr-sessionizer"
description = "herdr-sessionizer"
width       = "80%"
height      = "80%"

[[keys.command]]
key         = "prefix+n"
type        = "popup"
command     = "notarizer"
description = "notarizer"
width       = "80%"
height      = "80%"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"
