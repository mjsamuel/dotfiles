onboarding = false

[theme]
auto_switch = true
dark_name   = "rose-pine"
light_name  = "rose-pine-dawn"

[ui]
mouse_capture                    = true
pane_borders                     = true
pane_gaps                        = false
prompt_new_tab_name              = true
prompt_new_workspace_name        = true
accent                           = "blue"
tab_bar_position                 = "top"
agent_panel_sort                 = "priority"
right_click_passthrough_modifier = "alt"

[ui.toast]
herdr.position = "top-right"
clipboard.enabled = false

[keys]
prefix = "ctrl+b" # unused here; kept as the default fallback chord

# Misc
reload_config    = "alt+shift+r"
rename_tab       = "alt+comma"
new_tab          = "alt+c"
new_workspace    = "alt+shift+c"
detach           = "alt+d"
workspace_picker = "alt+s"
close_pane       = "alt+shift+x"
zoom             = "alt+z"
edit_scrollback  = "alt+shift+k"
toggle_sidebar   = "alt+;"
copy_mode        = "alt+["
help             = "alt+?"

# Switching tabs/windows
switch_tab = "alt+1..9"
last_pane  = "alt+l"

# Splits
split_horizontal = "alt+h"
split_vertical   = "alt+v"

# Switching panes
focus_pane_left  = "alt+b"
focus_pane_right = "alt+f"
focus_pane_up    = "alt+up"
focus_pane_down  = "alt+down"
swap_pane_up     = "alt+shift+["
swap_pane_down   = "alt+shift+]"

# Navigate mode
# navigate_workspace_down = "j"
# navigate_workspace_up   = "k"

# Worktrees
new_worktree  = "alt+shift+w"
open_worktree = "alt+w"

[[keys.command]]
key         = "alt+shift+s"
type        = "popup"
command     = "herdr-sessionizer"
description = "herdr-sessionizer"
width       = "80%"
height      = "80%"

[[keys.command]]
key         = "alt+shift+n"
type        = "popup"
command     = "notarizer"
description = "notarizer"
width       = "80%"
height      = "80%"

[worktrees]
directory = "~/.local/share/worktrees"
