<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TITLE</title>
<style>
  :root {
    --bg: #fff; --text: #222; --muted: #555; --line: #ddd; --link: #3a5fd9;
    --code: #f3f3f3; --pre: #f6f6f6;
    --goal-bg: #f4f8ff; --goal-edge: #6b8cff;
    --warn-bg: #fff7ec; --warn-edge: #e8a33d;
    --add: #e6f4ea; --del: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1d; --text: #e4e4e4; --muted: #a0a0a0; --line: #3a3a3d; --link: #8fa8ff;
      --code: #2a2a2d; --pre: #242427;
      --goal-bg: #1f2638; --goal-edge: #6b8cff;
      --warn-bg: #33291a; --warn-edge: #e8a33d;
      --add: #1e3324; --del: #3a2020;
    }
  }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: var(--text); background: var(--bg); }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid var(--line); }
  h3 { font-size: 1rem; margin-top: 1.5rem; }
  a { color: var(--link); }
  li { margin: .5rem 0; }
  code { background: var(--code); padding: 0 .25rem; border-radius: 3px; font-size: .9em; }
  pre { background: var(--pre); padding: .6rem .8rem; border-radius: 4px; overflow-x: auto; font-size: .85em; }
  pre code { background: none; padding: 0; font-size: 1em; }
  pre.mermaid { background: none; text-align: center; }
  table { border-collapse: collapse; margin: .8rem 0; font-size: .92em; }
  th, td { border: 1px solid var(--line); padding: .3rem .6rem; text-align: left; vertical-align: top; }
  th { background: var(--pre); }
  details { margin: .5rem 0; }
  summary { cursor: pointer; }
  .note { color: var(--muted); font-size: .9em; }
  .why { display: block; margin-left: 1.6rem; color: var(--muted); font-size: .9em; }
  .goal { background: var(--goal-bg); border-left: 3px solid var(--goal-edge); padding: .4rem .8rem; margin: .8rem 0; font-size: .92em; }
  .warn { background: var(--warn-bg); border-left: 3px solid var(--warn-edge); padding: .4rem .8rem; margin: .8rem 0; font-size: .92em; }
  ul.checklist { padding-left: 0; }
  ul.checklist > li { list-style: none; }
  ul.checklist label { cursor: pointer; }
  ul.checklist input { margin-right: .5rem; }
  .add { background: var(--add); display: block; }
  .del { background: var(--del); display: block; }
</style>
<script type="module">
  if (document.querySelector("pre.mermaid")) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", themeVariables: { fontFamily: "system-ui, sans-serif" } });
    await mermaid.run();
  }
</script>
</head>
<body>
<h1>TITLE</h1>
<p class="note">CONTEXT</p>

<!-- content -->

</body>
</html>
