- name: create agent directories
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "~/.agents"
    - "~/.agents/skills"
    - "~/.config/agents"
    - "~/.config/agents/skills"

- name: symlink agent instructions
  file:
    src: "{{ dotfiles_dir }}/agents/AGENTS.md"
    path: "{{ item }}/AGENTS.md"
    state: link
  loop:
    - "~/.agents"
    - "~/.config/agents"

- name: find all agent skills in dotfiles
  find:
    paths: "{{ dotfiles_dir }}/agents/skills"
    file_type: directory
    recurse: no
  register: agent_skills

- name: symlink agent skills
  file:
    src: "{{ item.1.path }}"
    path: "{{ item.0 }}/{{ item.1.path | basename }}"
    state: link
  loop: "{{ ['~/.agents/skills', '~/.config/agents/skills'] | product(agent_skills.files) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1.path | basename }}"
